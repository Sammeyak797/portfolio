<section id="experience" class="exp-section">
  <div class="section-wrap">
    <div class="section-title reveal">
      <span class="prompt">$</span>
      <span class="section-num">03.</span>
      <h2>work_experience</h2>
    </div>

    <div class="exp-list">
      <div class="exp-item reveal" *ngFor="let exp of experiences">
        <div class="exp-left">
          <div class="exp-dot" [class.active]="exp.current"></div>
          <div class="exp-line"></div>
        </div>
        <div class="exp-content">
          <div class="exp-top">
            <div>
              <h3 class="exp-role">{{ exp.role }}</h3>
              <p class="exp-company">
                <span class="at">@</span>{{ exp.company }}
                <span class="exp-type">— {{ exp.type }}</span>
              </p>
            </div>
            <div class="exp-right-meta">
              <span class="exp-period">{{ exp.period }}</span>
              <span class="exp-badge" *ngIf="exp.current">current</span>
            </div>
          </div>

          <ul class="exp-points">
            <ng-container *ngFor="let point of exp.points">
              <li>
                <span class="point-prompt">></span>
                {{ point }}
              </li>
            </ng-container>
          </ul>

          <div class="exp-stack">
            <ng-container *ngFor="let tech of exp.stack">
              <span class="stack-item">{{ tech }}</span>
            </ng-container>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
