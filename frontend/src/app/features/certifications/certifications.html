<section id="certifications" class="cert-section">
  <div class="section-wrap">
    <div class="section-title">
      <span class="prompt">$</span>
      <h2>certifications</h2>
    </div>

    <div class="cert-list">
      <div class="cert-item" *ngFor="let cert of certifications">
        <span class="cert-icon"><i class="ti {{ cert.icon }}"></i></span>
        <div class="cert-info">
          <p class="cert-title">{{ cert.title }}</p>
          <p class="cert-meta">{{ cert.issuer }} · {{ cert.year }}</p>
        </div>
        <a [href]="cert.verifyUrl" target="_blank" class="cert-verify">
          <i class="ti ti-external-link"></i> verify
        </a>
      </div>
    </div>
  </div>
</section>
